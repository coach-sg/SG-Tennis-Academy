document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

eCfg }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:none;border-radius:2px;background:#1F5E86;color:#fff;cursor:pointer\">Connect<\u002Fbutton><\u002Fdiv><span style=\"font-size:13px;color:#A8332A\">{{ loadErr }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ checkingAuth }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #D5DDE2;padding:28px;max-width:460px;margin:40px auto 0\"><div style=\"color:#5C7182;font-size:14px\">Connecting…<\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ needLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #D5DDE2;padding:28px;max-width:460px;margin:40px auto 0\"><div style=\"font-weight:600;font-size:17px;margin-bottom:4px\">Owner sign-in<\u002Fdiv><p style=\"color:#5C7182;font-size:13.5px;margin:0 0 16px\">Owner logins only.<\u002Fp><div style=\"display:grid;gap:12px\"><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Email<\u002Flabel><input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Password<\u002Flabel><input type=\"password\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ onPw }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\"><button sc-camel-on-click=\"{{ signIn }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:none;border-radius:2px;background:#1F5E86;color:#fff;cursor:pointer\">Sign in<\u002Fbutton><button sc-camel-on-click=\"{{ sendLink }}\" style=\"background:none;border:none;color:#1F5E86;font-size:13px;cursor:pointer;padding:0;text-decoration:underline\">Email me a sign-in link<\u002Fbutton><button sc-camel-on-click=\"{{ sendReset }}\" style=\"background:none;border:none;color:#1F5E86;font-size:13px;cursor:pointer;padding:0;text-decoration:underline\">Set or reset my password<\u002Fbutton><\u002Fdiv><span style=\"font-size:13px;color:#A8332A\">{{ authErr }}<\u002Fspan><span style=\"font-size:13px;color:#2E6B3A\">{{ authMsg }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ notOwner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #D5DDE2;padding:28px;max-width:460px;margin:40px auto 0\"><div style=\"font-weight:600;font-size:17px;margin-bottom:4px\">Not an owner login<\u002Fdiv><p style=\"color:#5C7182;font-size:13.5px;margin:0 0 16px\">{{ userEmail }} is signed in but isn't on the staff table as an owner. Add this email to Sammy's or David's staff row in Supabase, then sign in again.<\u002Fp><button sc-camel-on-click=\"{{ signOut }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;cursor:pointer\">Sign out<\u002Fbutton><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #D5DDE2;padding:28px;max-width:460px;margin:40px auto 0\"><div style=\"color:#5C7182;font-size:14px;margin-bottom:8px\">Loading from Supabase…<\u002Fdiv><p style=\"font-size:13px;color:#A8332A;margin:0 0 10px\">{{ loadErr }}<\u002Fp><div style=\"display:flex;gap:10px\"><button sc-camel-on-click=\"{{ retry }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;cursor:pointer\">Try again<\u002Fbutton><button sc-camel-on-click=\"{{ signOut }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;cursor:pointer\">Sign out<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ needPw }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #D5DDE2;padding:28px;max-width:460px;margin:40px auto 0\"><div style=\"font-weight:600;font-size:17px;margin-bottom:4px\">Set your password<\u002Fdiv><p style=\"color:#5C7182;font-size:13.5px;margin:0 0 16px\">Choose a password for {{ userEmail }}. You'll use it with your email to sign in.<\u002Fp><div style=\"display:grid;gap:12px\"><input type=\"password\" value=\"{{ newPw }}\" sc-camel-on-change=\"{{ onNewPw }}\" autocomplete=\"new-password\" placeholder=\"At least 8 characters\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><div><button sc-camel-on-click=\"{{ savePw }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:none;border-radius:2px;background:#1F5E86;color:#fff;cursor:pointer\">Save password<\u002Fbutton><\u002Fdiv><span style=\"font-size:13px;color:#A8332A\">{{ authErr }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ ready }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#123A54;color:#fff;border-radius:3px;overflow:hidden\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr))\">\n      <div style=\"padding:16px 18px\">\n        <div style=\"font-size:11px;letter-spacing:0.06em;color:#B7CCD9;margin-bottom:4px\">REVENUE<\u002Fdiv>\n        <div style=\"font-family:'Archivo Black',Archivo,sans-serif;font-size:30px;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums\">{{ kRevenue }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#B7CCD9;margin-top:5px\">{{ kSessions }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-left:1px solid rgba(255,255,255,.22)\">\n        <div style=\"font-size:11px;letter-spacing:0.06em;color:#B7CCD9;margin-bottom:4px\">COACH COST<\u002Fdiv>\n        <div style=\"font-family:'Archivo Black',Archivo,sans-serif;font-size:30px;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums\">{{ kCoach }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#B7CCD9;margin-top:5px\">{{ kCoachPct }} of revenue<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-left:1px solid rgba(255,255,255,.22)\">\n        <div style=\"font-size:11px;letter-spacing:0.06em;color:#B7CCD9;margin-bottom:4px\">OVERHEAD<\u002Fdiv>\n        <div style=\"font-family:'Archivo Black',Archivo,sans-serif;font-size:30px;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums\">{{ kOverhead }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#B7CCD9;margin-top:5px\">courts, gear, software, fees<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;border-left:1px solid rgba(255,255,255,.22);background:#1F5E86\">\n        <div style=\"font-size:11px;letter-spacing:0.06em;color:#B7CCD9;margin-bottom:4px\">TAKE-HOME<\u002Fdiv>\n        <div style=\"font-family:'Archivo Black',Archivo,sans-serif;font-size:30px;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:{{ netColor }}\">{{ kNet }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#B7CCD9;margin-top:5px\">{{ kMargin }} margin<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto;border-top:1px solid rgba(255,255,255,.22)\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;color:#fff\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:8px 18px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">PERIOD<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 12px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">REVENUE<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 12px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">COACH COST<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 12px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">OVERHEAD<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 12px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">TAKE-HOME<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 18px 8px 12px;font-weight:600;font-size:11px;letter-spacing:0.06em;color:#B7CCD9\">MARGIN<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ plRows }}\" as=\"r\" hint-placeholder-count=\"4\"><sc-raw-tr><sc-raw-td style=\"text-align:left;padding:7px 18px;border-top:1px solid rgba(255,255,255,.12);color:#E3ECF2\">{{ r.label }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;padding:7px 12px;border-top:1px solid rgba(255,255,255,.12)\">{{ r.rev }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;padding:7px 12px;border-top:1px solid rgba(255,255,255,.12)\">{{ r.co }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;padding:7px 12px;border-top:1px solid rgba(255,255,255,.12)\">{{ r.ov }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;padding:7px 12px;border-top:1px solid rgba(255,255,255,.12);font-weight:700;color:{{ r.netFg }}\">{{ r.net }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;padding:7px 18px 7px 12px;border-top:1px solid rgba(255,255,255,.12);color:#C9DAE4\">{{ r.mg }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <div style=\"background:rgba(0,0,0,.22);padding:8px 18px;font-size:12px;color:#C9DAE4;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n      <span>{{ liveNote }}<\u002Fspan>\n      <span>{{ seatNote }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:2px;margin:20px 0 0;flex-wrap:wrap;align-items:center\">\n    <span style=\"font-size:11px;letter-spacing:0.08em;color:#1F5E86;font-weight:600;padding:0 10px 0 2px;min-width:64px\">MANAGE<\u002Fspan>\n    <sc-for list=\"{{ manageBtns }}\" as=\"t\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font-size:14px;font-weight:500;padding:9px 14px;border:none;cursor:pointer;border-radius:2px 2px 0 0;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:2px;margin:4px 0 0;border-bottom:2px solid #1F5E86;flex-wrap:wrap;align-items:center\">\n    <span style=\"font-size:11px;letter-spacing:0.08em;color:#1F5E86;font-weight:600;padding:0 10px 0 2px;min-width:64px\">REPORTS<\u002Fspan>\n    <sc-for list=\"{{ tabBtns }}\" as=\"t\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font-size:14px;font-weight:500;padding:9px 14px;border:none;cursor:pointer;border-radius:2px 2px 0 0;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #D5DDE2;border-top:none;padding:18px\">\n\n    <sc-if value=\"{{ isPrograms }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"font-size:16px;margin:0 0 3px;font-weight:600\">What each program earns per court hour<\u002Fh2>\n      <p style=\"color:#5C7182;font-size:13px;margin:0 0 16px\">Court hours are the scarce resource. Rank by margin per hour, not by revenue.<\u002Fp>\n      <div style=\"overflow-x:auto\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align:left;padding:9px 8px;font-weight:600;font-size:12px;color:#5C7182;border-bottom:1.5px solid #10202C\">Program<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left;pad er;white-space:nowrap\">{{ f.status }}<\u002Fbutton>\n                <\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"border-left:3px solid #D8E93F;background:#FBFCE9;padding:10px 12px;font-size:13px;margin-top:16px\">Most of these facilities under-use their courts weekday midday and mid-afternoon. The pitch is filling empty slots, not competing for prime time — which is how an 18–22% revenue share stays easy for them to say yes to.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPlan }}\">\n      <h2 style=\"font-size:16px;margin:0 0 3px;font-weight:600\">90-day validation plan<\u002Fh2>\n      <p style=\"color:#5C7182;font-size:13px;margin:0 0 16px\">{{ planProgress }}<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n        <div>\n          <sc-for list=\"{{ planGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"margin-bottom:18px\">\n              <div style=\"font-size:11px;letter-spacing:0.08em;color:#1F5E86;font-weight:600;margin-bottom:6px\">{{ g.title }}<\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #D5DDE2;padding:9px 2px;cursor:pointer;font-size:13.5px;color:{{ m.color }}\">\n                  <span style=\"flex:0 0 auto;width:15px;height:15px;margin-top:2px;border:1.5px solid {{ m.boxBd }};background:{{ m.boxBg }};border-radius:2px\"><\u002Fspan>\n                  <span style=\"flex:1 1 auto;text-decoration:{{ m.deco }}\">{{ m.label }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n 0px 12px;font-size:13px;margin-top:18px\">No courts are bought. Partner facilities keep and run the courts; the academy brings programming into hours the facility is already paying for. That is what keeps capital requirements near zero and gross margin above 60% on the licensing and subscription lines.<\u002Fdiv>\n    <\u002Fsc-if>\n\n\n    <sc-if value=\"{{ isMSess }}\">\n      <h2 style=\"font-size:16px;margin:0 0 3px;font-weight:600\">{{ sessTitle }}<\u002Fh2>\n      <p style=\"color:#5C7182;font-size:13px;margin:0 0 14px;text-wrap:pretty\">{{ sessIntro }}<\u002Fp>\n      <div ref=\"{{ formRef }}\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;background:#F4F7F8;border:1px solid #D5DDE2;padding:14px;margin-bottom:18px\">\n        <div style=\"grid-column:1/-1;font-weight:600;font-size:14px\">{{ formTitle }}<\u002Fdiv>\n        <div style=\"grid-column:span 2;min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Name<\u002Flabel><input type=\"text\" value=\"{{ f.name }}\" sc-camel-on-change=\"{{ on.name }}\" placeholder=\"Fall 2026 Session VI\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv>\n        <div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Start<\u002Flabel><input type=\"date\" value=\"{{ f.start_date }}\" sc-camel-on-change=\"{{ on.start_date }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv>\n        <div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">End<\u002Flabel><input type=\"date\" value=\"{{ f.end_date }}\" sc-camel-on-change=\"{{ on.end_date }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv>\n        <div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Weeks<\u002Flabel><input type=\"number\" value=\"{{ f.weeks }}\" sc-camel-on-change=\"{{ on.weeks }}\" placeholder=\"Auto\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv>\n        <sc-if value=\"{{ isSessKind }}\"><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">First day $/week<\u002Flabel><input type=\"number\" value=\"{{ f.price }}\" sc-camel-on-change=\"{{ on.price }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Each extra day $/week<\u002Flabel><input type=\"number\" value=\"{{ f.add_price }}\" sc-camel-on-change=\"{{ on.add_price }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ isCampKind }}\"><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Drills $/day<\u002Flabel><input type=\"number\" value=\"{{ f.p_drill }}\" sc-camel-on-change=\"{{ on.p_drill }}\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><\u002Fsc-if><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Match play $/class<\u002Flabel><input type=\"number\" value=\"{{ f.p_match }}\" sc-camel-on-ch nter\">Save password<\u002Fbutton><\u002Fdiv>\n      <h3 style=\"font-size:14px;margin:0 0 8px;font-weight:600\">Supabase connection<\u002Fh3>\n      <p style=\"color:#5C7182;font-size:13px;margin:0 0 14px;text-wrap:pretty\">Project URL and publishable (anon) key, from Supabase → Project Settings → API Keys. Saved on this device.<\u002Fp>\n      <div style=\"display:grid;gap:10px;max-width:640px\"><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Project URL<\u002Flabel><input type=\"text\" value=\"{{ cfgUrl }}\" sc-camel-on-change=\"{{ onCfgUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><div style=\"min-width:0\"><label style=\"display:block;font-size:12px;color:#5C7182;margin:0 0 3px\">Publishable / anon key<\u002Flabel><input type=\"text\" value=\"{{ cfgKey }}\" sc-camel-on-change=\"{{ onCfgKey }}\" placeholder=\"sb_publishable_… or eyJ…\" style=\"width:100%;box-sizing:border-box;font-size:14px;padding:7px 9px;border:1px solid #D5DDE2;border-radius:2px;background:#fff;color:#10202C;min-height:36px\"><\u002Fdiv><div><button sc-camel-on-click=\"{{ saveCfg }}\" style=\"font-size:14px;font-weight:500;padding:8px 16px;border:none;border-radius:2px;background:#1F5E86;color:#fff;cursor:pointer\">Save and reconnect<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"alert\" style=\"position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:max-content;max-width:min(640px,calc(100vw - 32px));background:#A8332A;color:#fff;padding:12px 14px 12px 16px;border-radius:3px;box-shadow:0 6px 20px rgba(16,32,44,.25);display:flex;gap:14px;align-items:flex-start;z-index:50;font-size:14px;line-height:1.4\">\n      <span style=\"flex:1 1 auto;text-wrap:pretty\">{{ err }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ clearErr }}\" style=\"flex:0 0 auto;background:none;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:2px;font-size:12px;padding:3px 9px;cursor:pointer\">Dismiss<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180}}\">\nconst PRICE_FIRST = 75, PRICE_EXTRA = 62.5;\nconst SUPABASE_URL = 'https://aufjyhszohpykfvgyokm.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_N7bYnu1QXY-S3vKaq4DBzQ_f4Dg0BCe';\nconst CFG_KEY = 'sg.supabase';\nconst CUTOVER_FALLBACK = '2026-09-27';\nconst DAYNAME = {1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',7:'Sun'};\nconst LOC_DAYS = {SW:[1,4], MNW:[1,2,3,4,6]};\nconst EN_STATUS = ['pending','active','paused','withdrawn','completed'];\n// Class type values must match the classes.type enum. Update 'mental'/'fitness' if the new enum values are named differently.\nconst CLASS_TYPES = [['drill','Drill'],['mental','Mental coaching'],['fitness','Fitness'],['match','Match play'],['camp','Camp']];\nconst TYPE_HOURS = {drill:2, mental:1, fitness:1, match:3};\nconst PAID_RATE_TYPES = ['hourly','per_class'];\nconst coachPay = (co, sched, worked) => co.rate_type==='hourly' ? Math.round(num(co.rate_cents)*worked) : (co.rate_type==='per_class' ? Math.round(num(co.rate_cents)*(sched>0?worked/sched:1)) : 0);\nconst FAM_TYPES = [['charge','Charge',1],['makeup_charge','Make-up charge',1],['discount','Discount',-1],['scholarship','Scholarship',-1],['rain_credit','Rain credit',-1],['refund','Refund paid out',1],['adjustment','Adjustment (+ owes more, − credit)',0]];\nconst COACH_TYPES = [['payout','Payout',-1],['rain_deduction','Rain deduction',-1],['adjustment','Adjustment (+ owed more, − owed less)',0]];\nconst TYPE_LABEL = {opening_balance:'Opening balance',charge:'Charge',makeup_charge:'Make-up charge',discount:'Discount',scholarship:'Scholarship',rain_credit:'Rain credit',refund:'Refund',adjustment:'Adjustment',earned:'Earned',payout:'Payout',rain_deduction:'Rain deduction',payment:'Payment'};\nconst PAID_BY = ['Sammy','David'];\nconst EXP_CATS = ['Court fees','Software & services','Insurance','Equipment','Marketing','Travel','Other'];\nconst DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst FIELDS = ['p_drill','p_mental','p_fitness','p_match','day_pass','week_pass','disc_mode','camp_option','player_id','session_id','location_id','discount','scholarship','status','family_id','g1_name','g1_phone','g1_email','g2_name','g2_phone','g2_email',\n  'sms_opt_in','email_opt_in','first_name','last_name','birth_year','level','utr','utr_id','assigned_pro_id','school','medical_notes','emergency_contact','emergency_phone',\n  'date','amount','paid_for','enrollment_id','stripe_payment_id','entry_type','note','staff_id','start_time','end_time','type','capacity','paid_by',\n  'name','role','rate','rate_type','phone','active','category','description','start_date','end_date','weeks','price','add_price','skip','sched_hours','worked_hours'];\nconst locShort = n => /spring\\s*woods/i.test(n||'') ? 'SW' : (/memorial/i.test(n||'') ? 'MNW' : (n||''));\nconst ATT_STYLE = {att:{l:'Attended',c:'attended',bg:'#EAF4EC',fg:'#1E5B2E',bd:'#B9D8BF'}, forfeit:{l:'Forfeited',c:'forfeited',bg:'#FBEDEB',fg:'#A8332A',bd:'#E7C3BF'},\n  cr_money:{l:'Credit · off balance',c:'credited to balance',bg:'#EAF1F7',fg:'#1F5E86',bd:'#B9CFE0'}, cr_makeup:{l:'Credit · make-up',c:'make-up credits',bg:'#EAF1F7',fg:'#1F5E86',bd:'#B9CFE0'},\n  cr_open:{l:'Credit · family to choose',c:'credits not used yet',bg:'#EAF1F7',fg:'#1F5E86',bd:'#B9CFE0'}, absent:{l:'Absent · decide',c:'absences to decide',bg:'#FBF6EA',fg:'#8A5A00',bd:'#E7DCC0'},\n  cancelled:{l:'Class cancelled',c:'cancelled',bg:'#F1F3F5',fg:'#5C7182',bd:'#D5DDE2'}, unmarked:{l:'Not marked',c:'not marked',bg:'#F7F8F9',fg:'#5C7182',bd:'#D5DDE2'},\n  upcoming:{l:'Upco
